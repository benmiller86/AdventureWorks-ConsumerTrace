services:
  sql:
    image: chriseaton/adventureworks:latest
    container_name: adventureworks-sql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
    ports:
      # Published so host tools (SSMS, dotnet ef, dotnet run) can reach it at localhost:1433
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -d AdventureWorks -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    image: adventureworks-web-dev
    container_name: adventureworks-web
    ports:
      - "8080:8080"
    volumes:
      # Live source for dotnet watch hot reload
      - ./src:/src/src
      # Keep the container's bin/obj separate from the host's (host obj has Windows paths)
      - /src/src/AdventureWorks.Web/bin
      - /src/src/AdventureWorks.Web/obj
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Inside the compose network the database is reached by its service name
      - ConnectionStrings__AdventureWorks=Server=sql,1433;Database=AdventureWorks;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;Encrypt=False
    depends_on:
      sql:
        condition: service_healthy
